services:
  postgres:
    image: postgres:16
    container_name: Datastore-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - ${DB_PORT}:5433
    volumes:
      - Datastore:/var/lib/postgresql/data

  fastapi:
    build:
      context: .
      dockerfile: api/dockerfile
    container_name: store-api
    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://postgres${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/Datastore${POSTGRES_DB}
      JWT_SECRET_KEY: ${SECRET_KEY}

    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend/client
    container_name: frontend
    ports:
    - "${FRONTEND_PORT}:5173"
    depends_on:
    - fastapi

volumes:
  Datastore:


